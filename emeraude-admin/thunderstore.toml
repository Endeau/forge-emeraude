[config]
schemaVersion = "0.0.1"

[package]
# Nom de l'équipe Thunderstore qui publie le mod (à remplir, voir README.md)
namespace = "A_REMPLIR"
name = "EmeraudeAdmin"
versionNumber = "1.2.0"
description = "Dedicated server admin tools: per-player journal (positions, items gained/lost, deaths, saves) and admin console commands to give items and teleport players. French UI."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudeAdmin.dll"
target = "plugins/EmeraudeAdmin.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["server-side", "client-side", "tools", "utility"]
