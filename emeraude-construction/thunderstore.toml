[config]
schemaVersion = "0.0.1"

[package]
namespace = "Emeraude"
name = "EmeraudeConstruction"
versionNumber = "1.0.0"
description = "One key (Backspace by default) puts building snapping back to automatic after choosing a snap point with Q/E."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudeConstruction.dll"
target = "plugins/EmeraudeConstruction.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "building"]
