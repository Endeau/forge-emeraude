[config]
schemaVersion = "0.0.1"

[package]
# Nom de l'équipe Thunderstore qui publie le mod (à remplir, voir README.md)
namespace = "Emeraude"
name = "EmeraudeMontures"
versionNumber = "1.1.0"
description = "Mount Up Restored tweaks: wolves, boars and loxes can be ridden (not the asksvin), a tamed wolf or boar gets its rider's max health (never less than its own), and the camera stays steady while riding. French UI."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudeMontures.dll"
target = "plugins/EmeraudeMontures.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "server-side", "utility"]
