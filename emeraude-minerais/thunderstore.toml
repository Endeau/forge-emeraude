[config]
schemaVersion = "0.0.1"

[package]
# Nom de l'équipe Thunderstore qui publie le mod (à remplir, voir README.md)
namespace = "Emeraude"
name = "EmeraudeMinerais"
versionNumber = "1.1.0"
description = "Counts, per player, the ore put in smelters, the bars produced and the bars spent crafting or building. The server keeps the totals in a file for a leaderboard."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudeMinerais.dll"
target = "plugins/EmeraudeMinerais.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["server-side", "client-side", "utility"]
