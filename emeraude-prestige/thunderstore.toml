[config]
schemaVersion = "0.0.1"

[package]
namespace = "Emeraude"
name = "EmeraudePrestige"
versionNumber = "1.0.1"
description = "Monsters ignore players whose armor is ahead of their biome: wear Iron and the Black Forest leaves you alone. Starred and raid monsters still attack."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudePrestige.dll"
target = "plugins/EmeraudePrestige.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "server-side", "tweaks"]
