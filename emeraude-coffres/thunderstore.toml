[config]
schemaVersion = "0.0.1"

[package]
# Nom de l'équipe Thunderstore qui publie le mod (à remplir, voir README.md)
namespace = "Emeraude"
name = "EmeraudeCoffres"
versionNumber = "1.4.0"
description = "Craft From Containers fix: recipes that accept any one of several ingredients (like any fish at the food preparation table) now find that ingredient in nearby chests."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"
ValheimPortMods-Craft_Build_Smelt_Cook_Fuel_Pull_From_Containers = "4.1.0"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudeCoffres.dll"
target = "plugins/EmeraudeCoffres.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "server-side", "utility"]
