[config]
schemaVersion = "0.0.1"

[package]
# Nom de l'équipe Thunderstore qui publie le mod (à remplir, voir README.md)
namespace = "Emeraude"
name = "EmeraudeSanctuaire"
versionNumber = "1.1.0"
description = "An emerald statue to place in your village: no monster spawns in its radius, monsters flee its area, and no raid starts on a player standing inside."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/bin/Release/netstandard2.1/EmeraudeSanctuaire.dll"
target = "plugins/EmeraudeSanctuaire.dll"

[[build.copy]]
source = "./thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "server-side", "building", "tweaks"]
